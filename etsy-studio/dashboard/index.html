<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Seller Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <nav class="side" aria-label="Main">
        <div class="brand">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor" opacity=".12"/><path d="M7 15l3-3 2.5 2.5L17 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Seller Studio
        </div>
        <div class="nav" id="nav">
          <a href="#/home" data-route="home">Home</a>
          <a href="#/optimize" data-route="optimize">Optimize</a>
          <a href="#/research" data-route="research">Research</a>
          <a href="#/create" data-route="create">Create</a>
          <a href="#/drafts" data-route="drafts">Drafts <span class="count" id="draft-count" hidden></span></a>
          <a href="#/performance" data-route="performance">Performance</a>
        </div>
        <div class="side-foot" id="side-foot"></div>
      </nav>
      <main id="main" tabindex="-1">
        <div id="banner"></div>
        <div id="view" aria-live="polite"><p class="muted">Loading…</p></div>
        <p class="foot-note" id="disclosure"></p>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
